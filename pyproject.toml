[project]
name = "freshdesk-mcp"
version = "2.1.0"
description = "MCP server for the Freshdesk API with full endpoint coverage and computed reporting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.0",
    "pydantic>=2.10.6",
]

[[project.authors]]
name = "MissionMed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshdesk_mcp"]

[project.scripts]
freshdesk-mcp = "freshdesk_mcp.server:main"
